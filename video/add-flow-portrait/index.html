<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>Subtotal · two taps (portrait)</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #F4EFE6; }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; background: #F4EFE6; }
      .rules { position: absolute; inset: 0; background: repeating-linear-gradient(0deg, transparent 0 47px, rgba(216, 208, 194, 0.55) 47px 48px); }
      .stage { position: absolute; left: 220px; top: 150px; width: 640px; height: 1320px; transform-origin: top center; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main-p" data-start="0" data-width="1080" data-height="1920" data-duration="8">
      <div class="rules"></div>
      <div class="stage" id="stage-p">
        <div id="phone-host-p" data-composition-src="compositions/phone.html" data-composition-id="phone" data-start="0" data-duration="8" style="position:absolute;inset:0;"></div>
      </div>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      tl.fromTo("#stage-p", { scale: 1.0, y: 0 }, { scale: 1.06, y: -60, duration: 8, ease: "none" }, 0);
      window.__timelines["main-p"] = tl;
    </script>
  </body>
</html>
