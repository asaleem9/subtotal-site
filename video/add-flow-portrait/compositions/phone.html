<!doctype html>

<template>

  <style>

  <div class="device">
    <div class="screen">

  <script>
    (function () {
      const tl = gsap.timeline({ paused: true });
      const ease = "power3.out";
      const later = { immediateRender: false };
      // 0.7  a tap on the + button, the ledger resting underneath
      tl.fromTo("#phone-tap", { x: 399, y: 98, opacity: 0, scale: 0.4 }, { x: 399, y: 98, opacity: 1, scale: 1, duration: 0.3, ease }, 0.7)
        .to("#phone-tap", { opacity: 0, scale: 1.4, duration: 0.3, ease }, 1.0);
      // 1.2  the add sheet slides up and never comes back down
      tl.fromTo("#phone-s2", { yPercent: 100 }, { yPercent: 0, duration: 0.8, ease, ...later }, 1.2);
      // 2.2  typing "net", one letter per beat
      tl.fromTo("#phone-cover", { opacity: 0 }, { opacity: 1, duration: 0.05, ...later }, 2.15);
      tl.fromTo("#phone-typed .ch", { opacity: 0 }, { opacity: 1, duration: 0.05, stagger: 0.22, ...later }, 2.2);
      // 3.0  the Netflix tile answers, then the second tap
      tl.fromTo("#phone-hit", { opacity: 0, scale: 0.85 }, { opacity: 1, scale: 1, duration: 0.35, ease: "back.out(2)", ...later }, 3.0);
      tl.fromTo("#phone-tap", { x: 77, y: 271, opacity: 0, scale: 0.4 }, { x: 77, y: 271, opacity: 1, scale: 1, duration: 0.3, ease, ...later }, 3.7)
        .to("#phone-tap", { opacity: 0, scale: 1.4, duration: 0.3, ease }, 4.0);
      // 4.4  the receipt slides up; Add is the last tap
      tl.fromTo("#phone-s3", { yPercent: 100 }, { yPercent: 0, duration: 0.8, ease, ...later }, 4.6);
      // 6.4  back on the ledger with the new line
      tl.fromTo("#phone-s4", { opacity: 0 }, { opacity: 1, duration: 0.5, ...later }, 6.4);
      window.__timelines["phone"] = tl;
    })();
  </script>
